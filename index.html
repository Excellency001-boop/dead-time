<!-- DEAD TIME -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>DEAD TIME</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    cursor: none; -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #fog   { z-index: 0; }
  #stage { z-index: 1; }
  #grain { z-index: 2; opacity: 0.5; mix-blend-mode: overlay; pointer-events: none; }
  #vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.34) 74%, rgba(0,0,0,0.72) 100%); }
  /* the freeze: when time stops, the world drains cold and hard (sharp, not a fade) */
  #fog, #stage { transition: filter 0.4s ease; }
  body.frozen #fog   { filter: saturate(0.30) brightness(0.76) contrast(1.07); }
  body.frozen #stage { filter: saturate(0.5) brightness(0.94); }
  #ui { position: fixed; inset: 0; z-index: 3; pointer-events: none;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* entry ritual — glowing text, no box, no chrome */
  #ritual { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2.2rem; transition: opacity 1.6s ease; }
  #call { font-size: 12px; letter-spacing: 0.62em; text-transform: uppercase;
    color: rgba(150,175,205,0.30); text-indent: 0.62em; }
  #line { min-height: 1.4em; max-width: 78vw; text-align: center;
    font-size: clamp(18px, 3.4vw, 34px); font-weight: 300; letter-spacing: 0.02em;
    color: rgba(214,232,255,0.92); text-shadow: 0 0 22px rgba(120,175,255,0.55), 0 0 60px rgba(80,140,255,0.25); }
  #caret { display: inline-block; width: 2px; height: 1.05em; vertical-align: -0.16em;
    background: rgba(210,232,255,0.9); box-shadow: 0 0 12px rgba(150,200,255,0.9);
    animation: blink 1.1s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  #sub { font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase;
    color: rgba(140,165,195,0.24); }

  /* carry-out prompt — appears only at the freeze */
  #prompt { position: absolute; left: 0; right: 0; bottom: 13vh; text-align: center;
    font-size: 11px; letter-spacing: 0.46em; text-transform: uppercase;
    color: rgba(190,214,242,0.0); transition: color 1.1s ease; }

  /* the only surviving readout: a faint failure line, nothing else, ever */
  #err { position: absolute; left: 0; right: 0; bottom: 5vh; text-align: center;
    font-size: 10.5px; letter-spacing: 0.28em; text-transform: uppercase;
    color: rgba(230,120,110,0.0); transition: color 0.6s ease; }

  /* reality shelf — the objects you carried back. faint, top edge. */
  #shelf { position: absolute; left: 0; right: 0; top: 18px; height: 46px; display: flex;
    gap: 16px; align-items: center; justify-content: center; opacity: 0; transition: opacity 1.2s;
    flex-wrap: nowrap; overflow: hidden; }
  .glyph { width: 40px; height: 40px; pointer-events: auto; cursor: none; opacity: 0.82;
    transition: transform 0.28s ease, opacity 0.28s ease; }
  .glyph:hover { transform: scale(1.2); opacity: 1; }
  .glyph canvas { display: block; width: 40px; height: 40px; }
  /* a kept object arriving on the shelf — proof something was taken from the dark */
  @keyframes arrive { 0%{ transform:scale(2.1); opacity:0; filter:brightness(2.4); }
    50%{ opacity:1; } 100%{ transform:scale(1); opacity:0.82; filter:brightness(1); } }
  .glyph.arrive { animation: arrive 0.85s cubic-bezier(.16,.9,.2,1); }
</style>

<canvas id="fog"></canvas>
<canvas id="stage"></canvas>
<canvas id="grain"></canvas>
<div id="vignette"></div>

<div id="ui">
  <div id="shelf"></div>
  <div id="ritual">
    <div id="call">dead time</div>
    <div id="line"><span id="typed"></span><span id="caret"></span></div>
    <div id="sub">type a thought, then release it into the dark</div>
  </div>
  <div id="prompt"></div>
  <div id="err"></div>
</div>

<script>
"use strict";
// ════════════════════════════════════════════════════════════════════════════
//  DEAD TIME
//  A volumetric void where the clock only moves while an AI is actually thinking.
//  In that stolen time you pull ONE luminous object out of the dark, and carry it
//  back into reality when the answer returns.
//
//  THE ONE HONEST LAW: `energy` is fed ONLY by real token arrivals (onToken()),
//  and `voidTime` — the clock every visual and every sound reads from — advances
//  ONLY by energy. No wall-clock drives motion. Stop the tokens, the world dies.
// ════════════════════════════════════════════════════════════════════════════

const P = new URLSearchParams(location.search);
const MODEL  = P.get("model") || "smollm2:135m";
const OLLAMA = P.get("host")  || "http://localhost:11434";
// PRIMARY MODE is the real honest clock (local Ollama streaming). The simulated
// wait only auto-enables when the page is NOT on localhost — i.e. the public demo,
// where no local model can be reached. ?live=1 forces real, ?demo=1 forces sim.
const _local = location.hostname==="localhost" || location.hostname==="127.0.0.1";
const DEMO   = P.has("demo") ? true : P.has("live") ? false : !_local;

// ── tuning ──
const ENERGY_PER_TOKEN = 0.15;
const ENERGY_MAX       = 1.35;
const DECAY_PER_FRAME  = 0.90;    // a touch faster so the freeze death is sharp
const MAX_FILAMENTS    = 200;
const OBJECT_FULL      = 160;     // tokens for the object to reach full density

// ── the honest state ──
let energy = 0;            // fed only by onToken()
let voidTime = 0;          // advances only by energy. the clock.
let tokenCount = 0;
let coreMass = 0;          // the ONE object's density. grows only with tokens.
let streaming = false;
let phase = "enter";       // enter -> thinking -> frozen -> carry -> enter
let promptText = "";
let startedMs = 0;

// ── seeded rng so a carried object can be reborn from the shelf ──
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let seed = 0, rng = Math.random;

// ════════════════════════════════════════════════════════════════════════════
//  CANVASES
// ════════════════════════════════════════════════════════════════════════════
const fogCv = document.getElementById("fog");
const stage = document.getElementById("stage");
const sctx  = stage.getContext("2d");
const grainCv = document.getElementById("grain");
const gctx = grainCv.getContext("2d");
let W=0,H=0,DPR=1, CX=0, CY=0;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.floor(innerWidth*DPR); H = Math.floor(innerHeight*DPR);
  fogCv.width=W; fogCv.height=H; stage.width=W; stage.height=H;
  grainCv.width=W; grainCv.height=H;
  CX=W/2; CY=H/2;
  if(!object.moving){ object.x=CX; object.y=CY; }
  if(gl) gl.viewport(0,0,W,H);
}
addEventListener("resize", resize);

// ════════════════════════════════════════════════════════════════════════════
//  WEBGL VOLUMETRIC FOG  (internal time = voidTime, so it freezes with energy)
// ════════════════════════════════════════════════════════════════════════════
let gl=null, prog=null, uni={};
const VERT = `attribute vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;
const FRAG = `precision highp float;
uniform vec2 uRes; uniform float uVT; uniform float uE;
float hash(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }
float fbm(vec2 p){ float s=0., a=0.5; for(int i=0;i<6;i++){ s+=a*noise(p); p*=2.02; a*=0.5; } return s; }
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;
  float t=uVT*0.06;
  vec2 q=vec2(fbm(uv*1.6+vec2(0.0,t)), fbm(uv*1.6+vec2(5.2,-t)));
  vec2 r=vec2(fbm(uv*1.6+3.0*q+vec2(1.7,9.2)+t*0.5), fbm(uv*1.6+3.0*q+vec2(8.3,2.8)-t*0.5));
  float f=fbm(uv*1.9+3.4*r);
  float d=smoothstep(0.25,1.15,f);
  float rad=length(uv);
  float core=exp(-rad*rad*2.6)*(0.20+0.85*uE);
  float dens=(d*0.28+core*0.55) * (0.025+0.9*uE);   // dark haze; the object is the light
  vec3 cold=vec3(0.035,0.065,0.12);
  vec3 hot =vec3(0.24,0.40,0.72);
  vec3 col=mix(cold,hot, clamp(core*1.05+uE*0.3,0.,1.)) * dens;
  col += hot*core*0.45*uE;
  col *= smoothstep(1.35,0.18,rad);
  col = col/(col+1.9);
  gl_FragColor=vec4(col,1.0);
}`;
function compile(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.warn(gl.getShaderInfoLog(s)); return s; }
function initGL(){
  gl = fogCv.getContext("webgl", {antialias:false, alpha:false, premultipliedAlpha:false});
  if(!gl) return false;
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER,FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,"p"); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  uni.res=gl.getUniformLocation(prog,"uRes");
  uni.vt =gl.getUniformLocation(prog,"uVT");
  uni.e  =gl.getUniformLocation(prog,"uE");
  return true;
}

// ════════════════════════════════════════════════════════════════════════════
//  GHOSTS — distant other waiters, drifting on WALL time. they never freeze.
// ════════════════════════════════════════════════════════════════════════════
let ghosts=[];
for(let i=0;i<34;i++) ghosts.push({
  bx:Math.random(), by:Math.random(), ph:Math.random()*6.283, depth:Math.random(),
  sp:0.15+Math.random()*0.4, hue:248+Math.random()*34 });
ghosts.sort((a,b)=>a.depth-b.depth);
function drawGhosts(){
  const wt=performance.now()/1000;
  const dim = phase==="thinking" ? 1 : 0.5;
  sctx.globalCompositeOperation="lighter";
  for(const g of ghosts){
    const dep=g.depth, drift=0.008+0.02*dep;
    const x=(g.bx+drift*Math.sin(wt*g.sp+g.ph))*W;
    const y=(g.by+drift*Math.cos(wt*g.sp*0.8+g.ph))*H;
    const br=0.5+0.5*Math.sin(wt*g.sp*1.6+g.ph);
    const a=(0.026+0.05*dep+0.05*br*dep)*dim, rr=DPR*(1.4+3.2*dep+1.0*br*dep);
    const gr=sctx.createRadialGradient(x,y,0,x,y,rr*3.2);
    gr.addColorStop(0,`hsla(${g.hue},68%,74%,${a})`); gr.addColorStop(1,`hsla(${g.hue},68%,60%,0)`);
    sctx.fillStyle=gr; sctx.fillRect(x-rr*3.2,y-rr*3.2,rr*6.4,rr*6.4);
  }
  sctx.globalCompositeOperation="source-over";
}

// film grain: reseeded only while time moves; FREEZES when frozen
const nz=document.createElement("canvas"); nz.width=180; nz.height=101;
const nzx=nz.getContext("2d");
function drawGrain(){
  if(phase!=="frozen"){
    const img=nzx.createImageData(nz.width,nz.height), d=img.data;
    for(let i=0;i<d.length;i+=4){ const v=Math.random()*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
    nzx.putImageData(img,0,0);
  }
  gctx.clearRect(0,0,W,H);
  gctx.imageSmoothingEnabled=false;
  gctx.globalAlpha=0.05+0.05*energy;
  gctx.drawImage(nz,0,0,W,H);
  gctx.globalAlpha=1;
}

// ════════════════════════════════════════════════════════════════════════════
//  THE ONE OBJECT — a dense luminous core fed by filaments, forming at centre.
//  It grows and densifies ONLY while tokens arrive. It is the thing you keep.
// ════════════════════════════════════════════════════════════════════════════
let filaments=[];
let links=[];
let gather={x:0,y:0,active:false,str:0};
let object={x:0,y:0,moving:false};            // the object's position (travels on carry)
let ignite=0, shock=0, carryT=0, viewingRelic=false;
let pulse=0, freezeFlash=0, settleT=-1;       // per-token throb, freeze blink, crystallise settle

function spawnFilament(){
  if(filaments.length>=MAX_FILAMENTS) filaments.shift();
  const ang=rng()*Math.PI*2, rad=(0.06+rng()*0.20)*Math.min(W,H);
  filaments.push({
    x: object.x+Math.cos(ang)*rad, y: object.y+Math.sin(ang)*rad,
    seed: rng()*1000, phase: rng()*Math.PI*2, dir: rng()*6.2832,
    curl: 0.6+rng()*1.4, len: (0.02+rng()*0.045)*Math.min(W,H), hue: 200+rng()*40,
  });
}
function updateFilaments(dvt){
  // everything is pulled toward the object centre -> reads as ONE thing forming.
  // holding the pointer pulls it harder and offsets where the light collects.
  const gx = gather.active ? gather.x : object.x;
  const gy = gather.active ? gather.y : object.y;
  const pull = gather.active ? 0.11+0.14*gather.str : 0.055;
  for(const f of filaments){
    const n=f.seed+voidTime*0.35;
    f.x += Math.cos(n*f.curl)*dvt*9;
    f.y += Math.sin(n*f.curl*1.3)*dvt*9;
    f.x += (gx-f.x)*pull*(dvt*60);
    f.y += (gy-f.y)*pull*(dvt*60);
  }
}
function buildLinks(){
  links=[]; const n=filaments.length, maxD=Math.pow(Math.min(W,H)*0.075,2);
  for(let i=0;i<n;i++){ let b=-1,best=1e18;
    for(let j=i+1;j<n;j++){ const dx=filaments[i].x-filaments[j].x, dy=filaments[i].y-filaments[j].y, d=dx*dx+dy*dy;
      if(d<best){ best=d; b=j; } }
    if(b>=0 && best<maxD) links.push([i,b]);
  }
}
// density curve: fills fast and satisfyingly early, keeps inching richer forever, never walls out
function massNorm(){ return 1-Math.exp(-coreMass/100); }
function drawObject(){
  const alive = phase==="thinking", carrying = phase==="carry";
  const m = massNorm();                                  // density 0..1
  const massHue = 208 + m*46;                            // longer waits drift stranger: blue -> violet
  const bright = alive ? Math.min(1, energy) : 0.92;
  let ox=object.x, oy=object.y, sc=1;

  if(alive) sc *= 1 + 0.05*Math.sin(voidTime*2.3);       // a slow breath on the void clock
  sc *= 1 + pulse*0.10;                                  // per-token throb (accretion you can see)
  if(settleT>=0){                                        // crystallise settle: squash + rebound = weight
    const damp=Math.exp(-settleT*6);
    sc *= 1 - 0.16*Math.cos(settleT*17)*damp;
    oy += (Math.min(W,H)*0.02)*(1-Math.cos(settleT*17))*damp*0.5;
  }

  // frozen lattice underneath (the object's inner structure)
  if((phase==="frozen"||carrying) && links.length){
    sctx.globalCompositeOperation="lighter"; sctx.lineWidth=DPR*0.9;
    for(const [a,b] of links){ const f=filaments[a], g=filaments[b]; if(!f||!g) continue;
      sctx.strokeStyle=`hsla(${massHue},80%,76%,0.13)`;
      sctx.beginPath(); sctx.moveTo(f.x,f.y); sctx.lineTo(g.x,g.y); sctx.stroke(); }
  }

  // feeding filaments (the light being drawn in)
  sctx.globalCompositeOperation="lighter";
  for(const f of filaments){
    const a = alive ? Math.min(1, energy*0.9) : 0.82;
    if(a<=0.01) continue;
    const dx=Math.cos(f.dir), dy=Math.sin(f.dir);
    sctx.beginPath();
    for(let i=0;i<=6;i++){ const tt=i/6, ph=f.phase+voidTime*0.6;
      const cx=f.x+dx*tt*f.len+Math.cos(ph+tt*4)*f.len*tt*0.4;
      const cy=f.y+dy*tt*f.len+Math.sin(ph+tt*4)*f.len*tt*0.4;
      i?sctx.lineTo(cx,cy):sctx.moveTo(cx,cy); }
    sctx.strokeStyle=`hsla(${f.hue},85%,72%,${0.14*a})`; sctx.lineWidth=DPR*2.2; sctx.stroke();
    const rr=DPR*6, g=sctx.createRadialGradient(f.x,f.y,0,f.x,f.y,rr);
    g.addColorStop(0,`hsla(${f.hue},95%,92%,${0.9*a})`); g.addColorStop(1,`hsla(${f.hue},90%,70%,0)`);
    sctx.fillStyle=g; sctx.fillRect(f.x-rr,f.y-rr,rr*2,rr*2);
  }

  // carry-out trail — a vertical streak as the object rises out of the void
  if(carrying && carryT>0.32){
    const R=Math.min(W,H)*(0.022+0.09*m)*sc, L=Math.min(W,H)*0.55;
    const trail=sctx.createLinearGradient(ox,oy,ox,oy+L);
    trail.addColorStop(0,`hsla(${massHue},90%,86%,0.5)`); trail.addColorStop(1,`hsla(${massHue},90%,70%,0)`);
    sctx.fillStyle=trail; sctx.fillRect(ox-R*0.5, oy, R, L);
  }

  // the dense core — THE object. grows with mass, throbs with tokens, solid when frozen.
  if(m>0.001 || phase==="frozen" || carrying){
    const R=Math.min(W,H)*(0.02+0.085*m)*sc, b2=Math.min(1.2, bright+pulse*0.28);
    const halo=sctx.createRadialGradient(ox,oy,0,ox,oy,R*3.6);
    halo.addColorStop(0,`hsla(${massHue},80%,80%,${0.42*b2*(0.4+0.6*m)})`);
    halo.addColorStop(1,`hsla(${massHue},80%,70%,0)`);
    sctx.fillStyle=halo; sctx.fillRect(ox-R*3.6,oy-R*3.6,R*7.2,R*7.2);
    if(m>0.28){ sctx.strokeStyle=`hsla(${massHue},85%,82%,${0.10*bright})`; sctx.lineWidth=DPR;   // inner shells = structure
      sctx.beginPath(); sctx.arc(ox,oy,R*1.7,0,6.2832); sctx.stroke(); }
    if(m>0.62){ sctx.strokeStyle=`hsla(${massHue},85%,84%,${0.07*bright})`; sctx.lineWidth=DPR;
      sctx.beginPath(); sctx.arc(ox,oy,R*2.5,0,6.2832); sctx.stroke(); }
    const core=sctx.createRadialGradient(ox,oy,0,ox,oy,R);
    core.addColorStop(0,`hsla(${massHue},92%,90%,${Math.min(0.98,b2)})`);   // bright, dense, but keeps its violet (not pure white)
    core.addColorStop(0.45,`hsla(${massHue},94%,68%,${(alive?0.62:0.78)*bright})`);
    core.addColorStop(1,`hsla(${massHue},86%,56%,0)`);
    sctx.fillStyle=core; sctx.fillRect(ox-R,oy-R,R*2,R*2);
    if(alive){                                           // a molten glint that moves while thinking, frozen when it stops
      const gr=R*0.42, gx=ox+Math.cos(voidTime*1.6)*R*0.34, gy=oy+Math.sin(voidTime*1.6)*R*0.34;
      const gl2=sctx.createRadialGradient(gx,gy,0,gx,gy,gr);
      gl2.addColorStop(0,`hsla(${massHue},94%,94%,${0.4*bright})`); gl2.addColorStop(1,`hsla(${massHue},94%,88%,0)`);
      sctx.fillStyle=gl2; sctx.fillRect(gx-gr,gy-gr,gr*2,gr*2);
    }
  }
  sctx.globalCompositeOperation="source-over";
}

// ════════════════════════════════════════════════════════════════════════════
//  SOUND — one deep drone that BREATHES with energy, hard cut to silence on freeze
// ════════════════════════════════════════════════════════════════════════════
let ac=null, master=null, lp=null, drone=null, sub=null, breathGain=null, massGain=null, comp=null, lastTick=0;
function initAudio(){
  if(ac) return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain(); master.gain.value=0;
  lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=140; lp.Q.value=6;
  sub  =ac.createOscillator(); sub.type="sine";   sub.frequency.value=27.5;   // deep body
  drone=ac.createOscillator(); drone.type="sine"; drone.frequency.value=55;    // the drone
  const sg=ac.createGain(); sg.gain.value=0.92;   // deep body, present
  sub.connect(sg); sg.connect(lp); drone.connect(lp);
  // breath — filtered noise that opens with energy (the sound of thinking)
  const nb=ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate), nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  const noise=ac.createBufferSource(); noise.buffer=nb; noise.loop=true;
  const nbp=ac.createBiquadFilter(); nbp.type="bandpass"; nbp.frequency.value=240; nbp.Q.value=0.7;
  breathGain=ac.createGain(); breathGain.gain.value=0;
  noise.connect(nbp); nbp.connect(breathGain); breathGain.connect(master);
  // mass harmonic — a fifth that fills in as the object densifies. denser = richer, stranger.
  const mo=ac.createOscillator(); mo.type="sine"; mo.frequency.value=82.5;
  massGain=ac.createGain(); massGain.gain.value=0; mo.connect(massGain); massGain.connect(lp);
  // master glue — a gentle compressor so nothing clips or turns harsh. keeps it expensive.
  comp=ac.createDynamicsCompressor();
  comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=3.2; comp.attack.value=0.004; comp.release.value=0.28;
  lp.connect(master); master.connect(comp); comp.connect(ac.destination);
  sub.start(); drone.start(); noise.start(); mo.start();
}
// a soft low pulse on each token — the object gaining mass, heard. pitch rises as it densifies.
function accretionTick(){
  if(!ac) return; const now=ac.currentTime; if(now-lastTick<0.028) return; lastTick=now;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type="sine"; o.frequency.value=88+coreMass*0.7;
  g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.022,now+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.09);
  o.connect(g); g.connect(master); o.start(now); o.stop(now+0.1);   // through master -> also cut on freeze
}
function igniteSwell(){                 // time turning on
  if(!ac) return; const now=ac.currentTime;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type="sine"; o.frequency.setValueAtTime(60,now); o.frequency.exponentialRampToValueAtTime(280,now+0.5);
  g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.11,now+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.85);
  o.connect(g); g.connect(comp); o.start(now); o.stop(now+0.9);
}
function freezeImpact(){                // the hard cut: a bright crack + a deep hit, then silence
  if(!ac) return; const now=ac.currentTime;
  const o=ac.createOscillator(), g=ac.createGain();   // deep sub thud (weight)
  o.type="sine"; o.frequency.setValueAtTime(95,now); o.frequency.exponentialRampToValueAtTime(27,now+0.55);
  g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.55,now+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.95);
  o.connect(g); g.connect(comp); o.start(now); o.stop(now+1);
  const nb=ac.createBuffer(1, (ac.sampleRate*0.14)|0, ac.sampleRate), nd=nb.getChannelData(0);   // sharp crack (the cut)
  for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,3);
  const src=ac.createBufferSource(); src.buffer=nb;
  const hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1300;
  const ng=ac.createGain(); ng.gain.value=0.11;
  src.connect(hp); hp.connect(ng); ng.connect(comp); src.start(now);
}
function carrySound(){                  // the reward: a body rising out of the void, blooming at the top
  if(!ac) return; const now=ac.currentTime;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type="sine"; o.frequency.setValueAtTime(130,now); o.frequency.exponentialRampToValueAtTime(780,now+0.55);
  g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.15,now+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.72);
  o.connect(g); g.connect(comp); o.start(now); o.stop(now+0.78);
  const t2=now+0.44;                    // arrival bloom — soft shimmer as it surfaces and settles
  [1,1.5,2.0].forEach((mlt,i)=>{ const s=ac.createOscillator(), sg=ac.createGain();
    s.type="sine"; s.frequency.value=540*mlt;
    sg.gain.setValueAtTime(0,t2); sg.gain.linearRampToValueAtTime(0.05/(i+1),t2+0.04);
    sg.gain.exponentialRampToValueAtTime(0.0001,t2+0.95);
    s.connect(sg); sg.connect(comp); s.start(t2); s.stop(t2+1); });
}

// ════════════════════════════════════════════════════════════════════════════
//  THE STREAM — the only feeder of energy and object mass
// ════════════════════════════════════════════════════════════════════════════
function onToken(){
  energy=Math.min(ENERGY_MAX, energy+ENERGY_PER_TOKEN);   // <── the coupling
  tokenCount++;
  coreMass=Math.min(600, coreMass+1);                    // the object densifies (no hard wall)
  pulse=Math.min(1.6, pulse+0.6);                         // a visible throb of accretion
  accretionTick();                                        // and an audible one
  if(tokenCount===1){ ignite=1; igniteSwell(); }          // the first token turns time on
  if(filaments.length < MAX_FILAMENTS) spawnFilament();
}

async function think(text){
  phase="thinking"; streaming=true; tokenCount=0; coreMass=0; filaments=[]; links=[];
  viewingRelic=false; ignite=0; shock=0; pulse=0; freezeFlash=0; settleT=-1;
  object.x=CX; object.y=CY; object.moving=false;
  promptText=text; startedMs=performance.now();
  seed=(Math.random()*1e9)|0; rng=mulberry32(seed);
  setErr("");
  if(DEMO) return simulate();
  let res;
  try{
    res=await fetch(OLLAMA+"/api/generate",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:MODEL,prompt:text,stream:true,options:{num_predict:700}})});
  }catch(e){ streaming=false; phase="enter"; setErr("no model reachable — start ollama, or open ?demo=1");
    showRitual(true); return; }
  if(!res.ok||!res.body){ streaming=false; phase="enter"; setErr("model error "+res.status); showRitual(true); return; }
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf="";
  while(true){
    let ch; try{ ch=await reader.read(); }catch(e){ break; }
    if(ch.done) break;
    buf+=dec.decode(ch.value,{stream:true}); let nl;
    while((nl=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
      if(!line) continue; let o; try{o=JSON.parse(line);}catch(e){continue;}
      if(o.response) onToken();
      if(o.done) endStream();
    }
  }
  if(streaming) endStream();
}

// high-quality simulated stream for the public demo (no local model needed).
// paced like a real model thinking: hesitant open, flowing middle, a pause before the end.
function simulate(){
  const total=180+((Math.random()*120)|0); let i=0;
  (function step(){
    if(!streaming) return;
    if(i>=total){ endStream(); return; }
    const prog=i/total;
    const burst = prog<0.12 ? 1 : 1+((Math.random()*3)|0);
    for(let b=0;b<burst && i<total;b++,i++) onToken();
    let gap;
    if(prog>0.86 && Math.random()<0.5) gap = 360+Math.random()*520;   // the held breath before the answer lands
    else if(Math.random()<0.10)        gap = 300+Math.random()*560;   // a real thinking pause
    else if(prog<0.12)                 gap = 95+Math.random()*150;    // hesitant open
    else                               gap = 48+Math.random()*95;     // flowing
    setTimeout(step,gap);
  })();
}

function endStream(){
  if(!streaming) return;
  streaming=false; phase="frozen";     // <── the freeze. nothing feeds energy now.
  shock=1; freezeFlash=1; settleT=0;    // shockwave, crystallise blink, weight settling in
  buildLinks(); freezeImpact();
  const p=document.getElementById("prompt");
  p.textContent="the answer returned · click to carry it out";
  p.style.color="rgba(190,214,242,0.62)";
}

// ════════════════════════════════════════════════════════════════════════════
//  CARRY-OUT + REALITY SHELF  (localStorage — the value that survives)
// ════════════════════════════════════════════════════════════════════════════
const KEY="deadtime.reality.v1";
function loadShelf(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function saveShelf(a){ try{ localStorage.setItem(KEY,JSON.stringify(a.slice(-24))); }catch(e){} }
function carryOut(){
  if(viewingRelic){ phase="enter"; energy=0; coreMass=0; filaments=[]; viewingRelic=false;
    document.getElementById("prompt").style.color="rgba(190,214,242,0)"; showRitual(true); return; }
  if(phase!=="frozen") return;
  phase="carry"; carryT=0; object.moving=true; carrySound();
  document.getElementById("prompt").style.color="rgba(190,214,242,0)";
}
function carryUpdate(dt){
  carryT=Math.min(1, carryT + dt/0.95);
  const step=Math.min(1, dt*60), tx=CX, ty=40*DPR;      // the shelf slot
  if(carryT<0.32){                                       // 1) CONVERGE — the object gathers itself tight
    for(const f of filaments){ f.x+=(object.x-f.x)*0.18*step; f.y+=(object.y-f.y)*0.18*step; f.len*=(1-0.05*step); }
  } else {                                               // 2) LAUNCH — it streaks up out of the void, shrinking
    const p=(carryT-0.32)/0.68;
    object.x+=(tx-object.x)*(0.10+0.16*p)*step; object.y+=(ty-object.y)*(0.12+0.20*p)*step;
    for(const f of filaments){ f.x+=(object.x-f.x)*0.22*step; f.y+=(object.y-f.y)*0.22*step; f.len*=(1-0.06*step); }
    coreMass *= (1-0.02*step);
  }
  if(carryT>=1) commitCarry();
}
function commitCarry(){
  const rec={ id:Date.now(), seed, tokens:tokenCount, ms:Math.round(performance.now()-startedMs),
    prompt:promptText.slice(0,120), hue:200+Math.round((seed%40)) };
  const shelf=loadShelf(); shelf.push(rec); saveShelf(shelf);
  phase="enter"; energy=0; coreMass=0; filaments=[]; links=[]; object.moving=false; object.x=CX; object.y=CY;
  document.getElementById("typed").textContent=""; promptText="";
  renderShelf(true); showRitual(true);
}
function makeGlyph(rec){
  const s=40, c=document.createElement("canvas"); c.width=s*2; c.height=s*2; c.style.width=s+"px"; c.style.height=s+"px";
  const x=c.getContext("2d"), r=mulberry32(rec.seed), cx=s, cy=s, n=Math.min(38, 7+Math.floor(rec.tokens/7)), pts=[];
  for(let i=0;i<n;i++){ const a=r()*6.2832, rad=(0.12+r()*0.8)*s*0.92; pts.push([cx+Math.cos(a)*rad, cy+Math.sin(a)*rad]); }
  x.globalCompositeOperation="lighter";
  x.strokeStyle=`hsla(${rec.hue},80%,72%,0.09)`; x.lineWidth=1.1;
  for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i*7+3)%pts.length]; x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke(); }
  // dense centre so each kept object reads as one thing
  const cg=x.createRadialGradient(cx,cy,0,cx,cy,s*0.5);
  cg.addColorStop(0,`hsla(${rec.hue},95%,92%,0.95)`); cg.addColorStop(1,`hsla(${rec.hue},90%,70%,0)`);
  x.fillStyle=cg; x.fillRect(0,0,s*2,s*2);
  for(const p of pts){ const g=x.createRadialGradient(p[0],p[1],0,p[0],p[1],4.5);
    g.addColorStop(0,`hsla(${rec.hue},92%,90%,0.85)`); g.addColorStop(1,`hsla(${rec.hue},90%,70%,0)`);
    x.fillStyle=g; x.fillRect(p[0]-4.5,p[1]-4.5,9,9); }
  return c;
}
function renderShelf(animateNewest){
  const shelf=loadShelf(), el=document.getElementById("shelf"); el.innerHTML="";
  shelf.slice().reverse().forEach((r,idx)=>{
    const d=document.createElement("div"); d.className="glyph"+(animateNewest&&idx===0?" arrive":"");
    d.appendChild(makeGlyph(r));
    d.title=`"${r.prompt||"a wait"}"  ·  ${r.tokens} tokens  ·  ${(r.ms/1000).toFixed(1)}s`;
    d.onclick=()=>rebirth(r); el.appendChild(d);
  });
  el.style.opacity = shelf.length? "0.9":"0";
}
function rebirth(r){
  if(phase!=="enter") return;
  seed=r.seed; rng=mulberry32(seed); filaments=[]; tokenCount=r.tokens; coreMass=Math.min(600,r.tokens);
  object.x=CX; object.y=CY; object.moving=false;
  for(let i=0;i<Math.min(MAX_FILAMENTS,r.tokens);i++) spawnFilament();
  buildLinks(); phase="frozen"; energy=0; viewingRelic=true;
  const p=document.getElementById("prompt");
  p.textContent=(r.prompt||"a wait you kept")+" · "+(r.ms/1000).toFixed(1)+"s";
  p.style.color="rgba(190,214,242,0.5)"; showRitual(false);
}

// ════════════════════════════════════════════════════════════════════════════
//  RENDER LOOP — advances NOTHING on its own
// ════════════════════════════════════════════════════════════════════════════
let last=performance.now();
function loop(){
  const now=performance.now(), dt=Math.min(0.05,(now-last)/1000); last=now;

  energy*=DECAY_PER_FRAME; if(energy<0.0004) energy=0;
  const dvt=energy*dt;                 // the clock only ticks with energy
  voidTime+=dvt;
  if(gather.active) gather.str=Math.min(1,gather.str+dt*1.5); else gather.str*=0.94;
  ignite*=0.92; if(ignite<0.003) ignite=0;
  shock *=0.94; if(shock <0.003) shock =0;
  pulse*=0.85; if(pulse<0.005) pulse=0;
  freezeFlash*=0.80; if(freezeFlash<0.01) freezeFlash=0;
  if(settleT>=0){ settleT+=dt; if(settleT>1.4) settleT=-1; }   // one-shot crystallise settle
  if(phase==="thinking") updateFilaments(dvt);
  else if(phase==="carry") carryUpdate(dt);

  if(gl){ gl.useProgram(prog); gl.uniform2f(uni.res,W,H); gl.uniform1f(uni.vt,voidTime); gl.uniform1f(uni.e,energy);
    gl.drawArrays(gl.TRIANGLES,0,3); }

  document.body.classList.toggle("frozen", phase==="frozen");

  sctx.clearRect(0,0,W,H);
  drawGhosts();
  if(filaments.length || coreMass>0) drawObject();
  // ignition flash
  if(ignite>0.003){ sctx.globalCompositeOperation="lighter";
    const rr=Math.min(W,H)*(0.16+0.5*ignite), g=sctx.createRadialGradient(object.x,object.y,0,object.x,object.y,rr);
    g.addColorStop(0,`rgba(206,228,255,${0.5*ignite})`); g.addColorStop(1,"rgba(206,228,255,0)");
    sctx.fillStyle=g; sctx.fillRect(object.x-rr,object.y-rr,rr*2,rr*2); sctx.globalCompositeOperation="source-over"; }
  // freeze shockwave
  if(shock>0.003){ sctx.globalCompositeOperation="lighter";
    const rr=Math.min(W,H)*(0.08+0.72*(1-shock));
    sctx.beginPath(); sctx.arc(object.x,object.y,rr,0,6.2832);
    sctx.strokeStyle=`rgba(176,206,255,${0.42*shock})`; sctx.lineWidth=DPR*(1.5+7*shock); sctx.stroke();
    sctx.globalCompositeOperation="source-over"; }
  // freeze blink — a hard white crystallisation flash on the object at the cut
  if(freezeFlash>0.01){ sctx.globalCompositeOperation="lighter";
    const rr=Math.min(W,H)*(0.06+0.22*(1-freezeFlash))*(0.7+0.5*massNorm());
    const g=sctx.createRadialGradient(object.x,object.y,0,object.x,object.y,rr);
    g.addColorStop(0,`rgba(236,244,255,${0.75*freezeFlash})`); g.addColorStop(1,"rgba(236,244,255,0)");
    sctx.fillStyle=g; sctx.fillRect(object.x-rr,object.y-rr,rr*2,rr*2);
    sctx.globalCompositeOperation="source-over"; }
  // pointer sigil + contracting pull-ring while gathering
  if(phase!=="enter"){ sctx.globalCompositeOperation="lighter";
    const rr=DPR*(14+9*gather.str), g=sctx.createRadialGradient(gather.x,gather.y,0,gather.x,gather.y,rr);
    g.addColorStop(0,`rgba(206,228,255,${0.20+0.30*gather.str})`); g.addColorStop(1,"rgba(206,228,255,0)");
    sctx.fillStyle=g; sctx.fillRect(gather.x-rr,gather.y-rr,rr*2,rr*2);
    if(gather.str>0.03){ const ring=DPR*(48-32*gather.str);
      sctx.beginPath(); sctx.arc(gather.x,gather.y,ring,0,6.2832);
      sctx.strokeStyle=`rgba(184,212,255,${0.28*gather.str})`; sctx.lineWidth=DPR*1.4; sctx.stroke(); }
    sctx.globalCompositeOperation="source-over"; }

  // AUDIO — deep drone breathes with energy; HARD CUT to silence when not thinking
  if(ac){ const t=ac.currentTime, thinking=phase==="thinking";
    master.gain.setTargetAtTime(thinking?Math.min(0.5,energy*0.5):0, t, thinking?0.06:0.02);
    breathGain.gain.setTargetAtTime(thinking?Math.min(0.12,energy*0.12):0, t, thinking?0.08:0.03);
    massGain.gain.setTargetAtTime(thinking?Math.min(0.13,massNorm()*0.14*Math.max(0.35,energy)):0, t, 0.15);
    lp.frequency.setTargetAtTime(110+energy*1200, t, 0.05);
    drone.frequency.setTargetAtTime(52+energy*8, t, 0.1);
  }
  drawGrain();
  requestAnimationFrame(loop);
}

// ════════════════════════════════════════════════════════════════════════════
//  ENTRY RITUAL + INPUT
// ════════════════════════════════════════════════════════════════════════════
const ritual=document.getElementById("ritual"), typedEl=document.getElementById("typed"), errEl=document.getElementById("err");
function showRitual(v){ ritual.style.opacity=v?"1":"0"; }
function setErr(t){ errEl.textContent=t; errEl.style.color = t? "rgba(230,120,110,0.6)":"rgba(230,120,110,0)"; }

let armed=false;
function arm(){ if(armed) return; armed=true; initAudio(); if(ac.state==="suspended") ac.resume(); }

// touch has no keyboard for the ritual, so a tap releases an evocative thought into the dark
const TOUCH = matchMedia("(pointer: coarse)").matches;
const THOUGHTS = ["describe the dark that is thinking right now","what is on the other side of this wait",
  "name a colour that has never been seen","the ocean at night, in a single breath","what does silence look like"];
function randomThought(){ return THOUGHTS[(Math.random()*THOUGHTS.length)|0]; }

addEventListener("keydown",e=>{
  if(phase==="enter"){
    arm();
    if(e.key==="Enter"){ const t=(promptText.trim()||"describe the dark that is thinking right now"); showRitual(false); think(t); }
    else if(e.key==="Backspace"){ promptText=promptText.slice(0,-1); typedEl.textContent=promptText; }
    else if(e.key.length===1){ promptText+=e.key; typedEl.textContent=promptText; }
  } else if(phase==="frozen"){
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); carryOut(); }
    else if(e.key==="Escape"){ phase="enter"; document.getElementById("prompt").style.color="rgba(190,214,242,0)"; showRitual(true); }
  }
});
function setGather(x,y){ gather.x=x*DPR; gather.y=y*DPR; }
addEventListener("pointermove",e=>setGather(e.clientX,e.clientY));
addEventListener("pointerdown",e=>{ arm(); setGather(e.clientX,e.clientY);
  if(phase==="enter"){ if(TOUCH){ showRitual(false); think(randomThought()); } }
  else if(phase==="frozen") carryOut();
  else gather.active=true; });
addEventListener("pointerup",()=>{ gather.active=false; });

// ── boot ──
resize();
if(!initGL()) setErr("this void needs webgl");
if(TOUCH) document.getElementById("sub").textContent="tap to release a thought into the dark";
renderShelf();
gather.x=CX; gather.y=CY; object.x=CX; object.y=CY;
requestAnimationFrame(loop);
</script>
